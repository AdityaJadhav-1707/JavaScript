<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="Project1.css" />
  </head>
  <body>
    <button id="themeToggle">🌙 Dark Mode</button>

    <div class="container">
      <!-- Form Section -->
      <div class="form-container">
        <h2>New Call</h2>
        <form id="userForm">
          <label>Image URL</label>
          <input id="imgInput" required type="text" />

          <label>Full Name</label>
          <input id="nameInput" required type="text" />

          <label>Home Town</label>
          <input id="townInput" required type="text" />

          <label>Purpose</label>
          <input id="purposeInput" required type="text" />

          <label>Category</label>
          <label class="tag-checkbox">
            <input type="radio" name="Category" value="Emergency" required />
            <span>Emergency</span>
          </label>

          <label class="tag-checkbox">
            <input type="radio" name="Category" value="Emergency" required />
            <span>Important</span>
          </label>

          <label class="tag-checkbox">
            <input type="radio" name="Category" value="Emergency" required />
            <span>Urgent</span>
          </label>

          <label class="tag-checkbox">
            <input type="radio" name="Category" value="Emergency" required />
            <span>No Rush</span>
          </label>

          <button type="submit" class="submit-btn">Create Note</button>
        </form>
        <button type="reset" class="closeForm">Close</button>
      </div>
      <div class="note-container"></div>

      <!-- Live Preview Card -->
      <div class="preview-card">
        <img id="previewImg" src="" alt="Preview" />
        <h3 id="previewName">Full Name</h3>
        <p id="previewTown">Home Town</p>
        <p id="previewPurpose">Purpose</p>
        <span id="previewCategory" class="tag">Category</span>
      </div>
    </div>

    <script src="Project1.js"></script>
  </body>
</html>
